<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GhostBlock</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 300px;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      background: #0a0a0a;
      color: #e8e8e8;
      padding: 0;
      overflow: hidden;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #1e1e1e;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ghost-icon {
      font-size: 16px;
      line-height: 1;
    }

    .brand-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #fff;
      text-transform: uppercase;
    }

    .version-tag {
      font-size: 10px;
      color: #3a3a3a;
      letter-spacing: 0.04em;
    }

    /* Main toggle section */
    .main {
      padding: 20px 16px 16px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .status-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .status-label {
      font-size: 11px;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .status-value {
      font-size: 14px;
      font-weight: 700;
      color: #ff4444;
      letter-spacing: 0.04em;
    }

    .status-value.on {
      color: #00e676;
    }

    /* Toggle switch */
    .toggle {
      width: 48px;
      height: 26px;
      border-radius: 2px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      cursor: pointer;
      position: relative;
      transition: background 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .toggle.active {
      background: #00e676;
      border-color: #00e676;
    }

    .toggle::after {
      content: '';
      width: 20px;
      height: 18px;
      border-radius: 1px;
      background: #333;
      position: absolute;
      top: 3px;
      left: 3px;
      transition: transform 0.15s, background 0.15s;
    }

    .toggle.active::after {
      transform: translateX(22px);
      background: #0a0a0a;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 2px;
      padding: 12px 14px;
    }

    .stat-num {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
      margin-bottom: 5px;
    }

    .stat-desc {
      font-size: 10px;
      color: #3a3a3a;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* Bottom bar */
    .bottombar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      border-top: 1px solid #1a1a1a;
      margin-top: 4px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff4444;
      flex-shrink: 0;
    }

    .dot.active {
      background: #00e676;
      box-shadow: 0 0 8px rgba(0, 230, 118, 0.5);
    }

    .tag {
      font-size: 10px;
      color: #2a2a2a;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Credit */
    .credit {
      border-top: 1px solid #141414;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .credit-author {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .credit-author a {
      font-size: 11px;
      color: #3a3a3a;
      text-decoration: none;
      letter-spacing: 0.04em;
    }

    .credit-author a:hover { color: #888; }

    .credit-label {
      font-size: 10px;
      color: #222;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .support-links {
      display: flex;
      gap: 8px;
    }

    .support-links a {
      font-size: 10px;
      color: #2a2a2a;
      text-decoration: none;
      border: 1px solid #1e1e1e;
      border-radius: 2px;
      padding: 3px 7px;
      letter-spacing: 0.04em;
      transition: color 0.15s, border-color 0.15s;
    }

    .support-links a:hover {
      color: #00e676;
      border-color: #00e676;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <span class="ghost-icon">👻</span>
      <span class="brand-name">GhostBlock</span>
    </div>
    <span class="version-tag">v1.0.0</span>
  </div>

  <div class="main">
    <div class="toggle-row">
      <div class="status-group">
        <span class="status-label">Status</span>
        <span class="status-value" id="statusText">OFF</span>
      </div>
      <div class="toggle" id="toggleBtn"></div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-num" id="todayCount">0</div>
        <div class="stat-desc">Today</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="totalCount">0</div>
        <div class="stat-desc">All Time</div>
      </div>
    </div>
  </div>

  <div class="bottombar">
    <div class="dot" id="statusDot"></div>
    <span class="tag">Silent · Invisible · Undetectable</span>
  </div>

  <div class="credit">
    <div class="credit-author">
      <span class="credit-label">by</span>
      <a href="https://github.com/Irnhakim" target="_blank">@Irnhakim</a>
    </div>
    <div class="support-links">
      <a href="https://saweria.co/irnhakim" target="_blank">Saweria</a>
      <a href="https://buymeacoffee.com/irnhakim" target="_blank">Buy Me a Coffee</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
